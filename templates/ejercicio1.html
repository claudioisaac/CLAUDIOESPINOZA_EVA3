<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ejercicio 1 - Notas y Asistencia</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='estilos.css') }}">
</head>
<body>
    <div class="formulario">
        <h2>Formulario de Notas</h2>
        <form method="POST">
            <label>Nota 1:</label>
            <input type="number" name="nota1" min="10" max="70" step="any" required>
            <label>Nota 2:</label>
            <input type="number" name="nota2" min="10" max="70" step="any" required>
            <label>Nota 3:</label>
            <input type="number" name="nota3" min="10" max="70" step="any" required>
            <label>Asistencia (%):</label>
            <input type="number" name="asistencia" min="0" max="100" step="any" required>
            <button type="submit" class="boton">Enviar</button>
        </form>
        {% if error %}
            <p class="error">{{ error }}</p>
        {% endif %}
        {% if promedio is not none %}
            <div class="resultado">
                <p>Promedio: {{ promedio }}</p>
                <p>Estado: {{ estado }}</p>
            </div>
        {% endif %}
        <a href="/" class="volver">Volver al menú principal</a>
    </div>
</body>
</html>
